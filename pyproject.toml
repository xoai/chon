[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chon"
version = "1.0.0"
description = "Serving code for the Chon typed-decision models: calibrated option probabilities over the TypeSafe /v1/systemone wire format."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6",
  "transformers>=5.5",
  "peft>=0.17",
  "accelerate>=1.10",
  "huggingface_hub>=0.30",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
fp8 = ["torchao>=0.12"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["chon*"]
